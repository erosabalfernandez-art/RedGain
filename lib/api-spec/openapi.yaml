openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RedGain rewards platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User dashboard operations
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── User dashboard ────────────────────────────────────────────────────────
  /users/me/referrals:
    get:
      operationId: getMyReferrals
      tags: [users]
      summary: Get my direct referrals (single level)
      responses:
        "200":
          description: Direct referrals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectReferrals"

  /users/me/referral-code:
    get:
      operationId: getMyReferralCode
      tags: [users]
      summary: Get the current user's referral code and link
      responses:
        "200":
          description: Referral code info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralCode"

  /users/me/notifications:
    get:
      operationId: getMyNotifications
      tags: [users]
      summary: Get in-app notifications for the current user (last 50, newest first)
      responses:
        "200":
          description: Notifications list with unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /users/me/notifications/mark-read:
    patch:
      operationId: markNotificationsRead
      tags: [users]
      summary: Mark all unread notifications as read
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/me/bsc-wallet:
    patch:
      operationId: updateMyBscWallet
      tags: [users]
      summary: Set or update the user's BSC wallet address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBscWalletInput"
      responses:
        "200":
          description: Wallet updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBscWalletResponse"
        "400":
          description: Invalid address or already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin ─────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update user status or role (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Cannot delete admin account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    UpdateBscWalletInput:
      type: object
      required: [bscWallet]
      properties:
        bscWallet:
          type: string
          description: BSC wallet address (0x...)

    UpdateBscWalletResponse:
      type: object
      properties:
        success:
          type: boolean
        bscWallet:
          type: ["string", "null"]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    RegisterInput:
      type: object
      required: [name, email, password, phone]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          description: Phone number with country code e.g. +5588992543996
        password:
          type: string
          minLength: 6
        referralCode:
          type: ["string", "null"]
        bscWallet:
          type: ["string", "null"]
          description: BSC wallet address (0x...) where the user receives USDT withdrawals

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, email, role, accountStatus, referralCode, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        accountStatus:
          type: string
          enum: [pending, active, paused, lost]
        referralCode:
          type: string
        bscWallet:
          type: ["string", "null"]
          description: BSC wallet address (USDT withdrawals)
        createdAt:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    ReferralPerson:
      type: object
      required: [id, name, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        joinedAt:
          type: string

    DirectReferrals:
      type: object
      required: [level1, totals]
      properties:
        level1:
          type: array
          items:
            $ref: "#/components/schemas/ReferralPerson"
        totals:
          type: object
          required: [count]
          properties:
            count:
              type: integer

    ReferralCode:
      type: object
      required: [code, link, active]
      properties:
        code:
          type: string
        link:
          type: string
        active:
          type: boolean
          description: Whether the code is currently active and usable

    AdminUser:
      type: object
      required: [id, name, email, role, accountStatus, referralCode, totalReferrals, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        whatsappUrl:
          type: ["string", "null"]
        role:
          type: string
        accountStatus:
          type: string
          enum: [pending, active, paused, lost]
        referralCode:
          type: string
        referrerName:
          type: ["string", "null"]
        referrerId:
          type: ["integer", "null"]
        totalReferrals:
          type: integer
        joinedAt:
          type: string

    AdminUserUpdate:
      type: object
      properties:
        accountStatus:
          type: string
          enum: [pending, active, paused, lost]
        role:
          type: string
          enum: [user, admin]

    Notification:
      type: object
      required: [id, type, title, body, read, metadata, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          description: "new_referral | system"
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string

    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount:
          type: integer
