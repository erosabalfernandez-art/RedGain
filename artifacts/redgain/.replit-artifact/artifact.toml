kind = "web"
previewPath = "/"
title = "RedGain"
version = "1.0.0"
id = "artifacts/redgain"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21872

[services.development]
run = "pnpm --filter @workspace/redgain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/redgain", "run", "build" ]
serve = "static"
publicDir = "artifacts/redgain/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21872"
BASE_PATH = "/"
